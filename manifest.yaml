---
# cloud.gov (Cloud Foundry) deployment manifest.
#
# cloud.gov injects PORT=8080 at runtime; watershed_evidence_mcp.server picks that up and
# serves streamable HTTP at /mcp with a /health check. Deploy with the Python buildpack,
# which installs requirements.txt (no Docker needed):
#
#   cf login -a api.fr.cloud.gov --sso
#   cf target -o <your-org> -s <your-space>
#   cf push
#   cf set-env watershed-evidence-mcp ATTAINS_API_KEY <key>   # optional; never put it here
#   cf restart watershed-evidence-mcp                         # set-env applies on restart
#
# .cfignore keeps .env, .venv/ and other local files out of the upload.
#
# The HTTP endpoint is unauthenticated (see SECURITY.md). One instance is enough: each
# instance keeps its own DuckDB response cache on its own temporary disk. Rename the route
# to something unique before pushing.
applications:
  - name: watershed-evidence-mcp
    buildpacks:
      - python_buildpack
    command: PYTHONPATH=src python -m watershed_evidence_mcp.server
    health-check-type: http
    health-check-http-endpoint: /health
    env:
      PYTHONUNBUFFERED: 1
    routes:
      - route: watershed-evidence-mcp.app.cloud.gov
    instances: 1
    disk_quota: 1G
    memory: 512M
